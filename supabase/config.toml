project_id = "verbenai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://verbenai.app"
additional_redirect_urls = []
jwt_expiry = 3600
enable_anonymous_sign_ins = true

[storage]
enabled = true
file_size_limit = "25MiB"

[edge_runtime]
enabled = true

# RevenueCat manda su propio header Authorization (no un JWT de Supabase, ver
# revenuecat-webhook/index.ts) -- sin esto, el gateway de Supabase rechaza la
# petición con 401 antes de que la función llegue a comprobarlo ella misma.
[functions.revenuecat-webhook]
verify_jwt = false

# El cron job de pg_cron/pg_net manda "Authorization: Bearer <CRON_SECRET>"
# (no un JWT de Supabase, ver cleanup-expired-photos/index.ts) -- mismo caso
# que revenuecat-webhook.
[functions.cleanup-expired-photos]
verify_jwt = false
