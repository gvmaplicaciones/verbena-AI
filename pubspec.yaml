name: verbenai
description: "VerbenAI — genera fotos con IA en escenas predefinidas o por texto libre."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Estado / navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.0

  # Pagos / suscripciones. Fijado exacto (sin ^): la SDK ha tenido dos majors
  # con breaking changes en poco tiempo (9.0.0, 10.0.0), así que subimos a
  # mano tras revisar el changelog en vez de dejar que un minor/patch
  # arrastre algo sin avisar. purchases_ui_flutter se quitó: no se usa en
  # ningún sitio del código (no hay PaywallView/RevenueCatUI).
  purchases_flutter: 10.4.2

  # Diseño (Anton + Work Sans, ver core/theme)
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Selección de foto y compartir
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  # "Guardar" en Result (carrete del dispositivo) y "Gestionar suscripción"
  # en Perfil (abre la pantalla nativa de suscripciones de la tienda -- una
  # cancelación real solo puede hacerse ahí, nunca con un toggle in-app).
  gal: ^2.3.0
  url_launcher: ^6.3.1

  # Analítica / crash reporting (instrumentado desde el día 1, ver
  # services/analytics_service.dart)
  posthog_flutter: ^4.6.0
  sentry_flutter: ^8.11.0

  crypto: ^3.0.5

  # Google Sign-In nativo (vincula la sesión anónima o recupera cuenta, ver
  # data/repositories/auth_repository.dart). API v7: GoogleSignIn.instance +
  # initialize() async, en vez del viejo constructor/signIn() síncrono.
  google_sign_in: ^7.2.0

  # Persistir el refresh token de la sesión anónima mientras se opera en el
  # menú de admin oculto (ver data/repositories/admin_repository.dart), para
  # poder restaurarla aunque la app se cierre a medias.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/google_logo.png
    - assets/modes/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#3D5C52"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
